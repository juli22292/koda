name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Desktop tests
        run: npm run test:e2e
        env:
          KODA_TEST_EXE: release/win-unpacked/Koda.exe
      - name: Agent permissions and live terminal tests
        run: npm run test:agent
        env:
          KODA_TEST_EXE: release/win-unpacked/Koda.exe
      - run: npm run test:updates
      - name: Native build workflow tests
        run: npm run test:builds
        env:
          KODA_TEST_EXE: release/win-unpacked/Koda.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Koda-Windows-${{ github.sha }}
          path: |
            release/Koda-Setup-*-x64.exe
            release/Koda-Setup-*-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Koda-test-screenshots
          path: artifacts/*.png
          retention-days: 7
